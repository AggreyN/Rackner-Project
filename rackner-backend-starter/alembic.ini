# Alembic configuration for Rackner FDI.
# The database URL is NOT set here — alembic/env.py reads DATABASE_URL from the
# environment (via app.config) so secrets stay out of version control.

[alembic]
script_location = alembic
prepend_sys_path = .
# Use path-based version naming so files sort readably (0001_, 0002_, ...).
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
